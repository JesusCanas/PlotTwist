<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlotTwist</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav>
        <img src="assets/img/logo-icon.png" alt="logo">
        <img src="assets/img/logo-texto.png" alt="plottwist">
    </nav>

    <div class="buscador-seccion">
        <div class="buscador-contenedor">
            <input id="buscador" type="text" placeholder="Buscar...">
        </div>
    </div>

    <div class="filtros">
        <select id="valoracion" class="filtro-select" >
            <option value="">Valoración</option>
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
        </select>

        <select id="genero" class="filtro-select" multiple size="1">
            <option value="ACCION">Acción</option>
            <option value="THRILLER">Thriller</option>
            <option value="DRAMA">Drama</option>
            <option value="COMEDIA">Comedia</option>
            <option value="FANTASIA">Fantasía</option>
            <option value="CIENCIA_FICCION">Ciencia Ficción</option>
            <option value="ROMANCE">Romance</option>
            <option value="MISTERIO">Misterio</option>
        </select>

        <select id="anyo" class="filtro-select">
            <option value="">Año de estreno</option>
             <option value="1988">1988</option>
            <option value="1990">1990</option>
            <option value="1994">1994</option>
            <option value="1995">1995</option>
            <option value="1997">1997</option>
            <option value="1998">1998</option>
            <option value="1999">1999</option>
            <option value="2001">2001</option>
            <option value="2003">2003</option>
            <option value="2004">2004</option>
            <option value="2005">2005</option>
            <option value="2008">2008</option>
            <option value="2010">2010</option>
            <option value="2011">2011</option>
            <option value="2013">2013</option>
            <option value="2014">2014</option>
            <option value="2015">2015</option>
            <option value="2016">2016</option>
            <option value="2017">2017</option>
            <option value="2018">2018</option>
            <option value="2019">2019</option>
            <option value="2022">2022</option>
        </select>
    </div>

    <div id= pelis class="peliculas">
        
        <div id="pelicula-contenedor" class="poster-categoria">
            <img src="assets/img/pelicula-icon.png" alt="icono peliculas">
            <p>PELÍCULAS</p>
        </div>
    </div>

    <div id=serie class="series"> 
        <div id="serie-contenedor" class="poster-categoria">
            <img src="assets/img/serie-icon.png" alt="icono series">
            <p>SERIES</p>
        </div>
    </div>

    <div id="metrajes" class="peliculas">

    </div>
    <script src="js/main.js"></script>
</body>

</html>
